services:
  - type: web
    name: mostakshef
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mostakshef-db
          property: connectionString
      - key: YOUTUBE_HANDLE
        value: "@mohamed.alfeki"
      - key: YOUTUBE_CHANNEL_URL
        value: "https://youtube.com/@mohamed.alfeki"
      - key: YOUTUBE_API_KEY
        sync: false

databases:
  - name: mostakshef-db
    plan: free
